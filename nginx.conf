server {
    listen 80;
    server_name localhost;

    # Static WebApp
    location /app/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # Static Images CDN
    location /images/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Static Dashboard Admin SPA
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    location = /admin {
        return 301 /admin/;
    }

    # Dashboard FastAPI endpoints
    location /api/admin/ {
        proxy_pass http://dashboard_api:8000/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Документация Swagger (для удобной проверки)
    location /api/admin/docs {
        proxy_pass http://dashboard_api:8000/docs;
        proxy_set_header Host $host;
    }
    location /api/admin/openapi.json {
        proxy_pass http://dashboard_api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Everything else (webhooks, n8n UI, API) -> n8n
    location / {
        proxy_pass http://n8n:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for n8n editor
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
    }
}
