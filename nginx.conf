server {
    listen 80;
    server_name localhost;

    # Embedded Docker DNS resolver (re-resolves dynamic container IPs)
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Static WebApp (both /app/ and /webapp/)
    location /webapp/ {
        alias /usr/share/nginx/html/app/;
        index index.html;
        try_files $uri $uri/ /webapp/index.html;
    }
    location = /webapp {
        return 301 /webapp/;
    }

    location /app/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }
    location = /app {
        return 301 /app/;
    }

    # Static Images CDN
    location /images/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Static Generated Presentations CDN
    location /presentations/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Static Dashboard Admin SPA
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    location = /admin {
        return 301 /admin/;
    }

    # API Endpoints (Manager mode, Admin TG, Products, Analytics)
    location /api/ {
        set $dashboard_backend "http://dashboard_api:8000";
        proxy_pass $dashboard_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger
    location /api/admin/docs {
        set $dashboard_backend "http://dashboard_api:8000";
        proxy_pass $dashboard_backend/docs;
        proxy_set_header Host $host;
    }
    location /api/admin/openapi.json {
        set $dashboard_backend "http://dashboard_api:8000";
        proxy_pass $dashboard_backend/openapi.json;
        proxy_set_header Host $host;
    }

    # Everything else (webhooks, n8n UI, API) -> n8n
    location / {
        set $n8n_backend "http://n8n:5678";
        proxy_pass $n8n_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for n8n editor
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
    }
}
